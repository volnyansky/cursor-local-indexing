[tool.poetry]
name = "cursor-local-indexing"
version = "0.1.0"
description = "Local code indexing server for Cursor using ChromaDB and LlamaIndex"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
chromadb = "1.4.1"
fastmcp = "3.2.0"
llama-index-core = "0.14.20"
llama-index-readers-file = "0.6.0"
tree-sitter-language-pack = "1.5.0"
watchdog = "6.0.0"
ollama = "^0.6.1"

[tool.poetry.group.dev.dependencies]

[tool.poetry.scripts]

[build-system]
requires = ["poetry-core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["tests/content"]
